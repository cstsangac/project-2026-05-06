name: gifts-demo

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: gifts
      POSTGRES_USER: gifts
      POSTGRES_PASSWORD: gifts
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gifts -d gifts"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"

  user-wallet-service:
    build:
      context: ./services/user-wallet-service
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/gifts
      DB_USER: gifts
      DB_PASSWORD: gifts
      REDIS_HOST: redis
      REDIS_PORT: 6379
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC_GIFT_SENT: gift.sent
      JWT_SECRET: dev-secret-change-me
      LEADERBOARD_ENABLED: "true"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_started

  notification-service-go:
    build:
      context: ./services/notification-service-go
    environment:
      PORT: "8090"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC_GIFT_SENT: gift.sent
      KAFKA_GROUP_ID: notification-service-go
    ports:
      - "8090:8090"
    depends_on:
      kafka:
        condition: service_started

